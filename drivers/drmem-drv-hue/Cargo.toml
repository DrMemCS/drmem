[package]
name = "drmem-drv-hue"
version = "0.1.0"
edition = "2024"

[dependencies]
serde.workspace = true
serde.default-features = false
serde.features = ["derive"]

palette.workspace = true

tokio.workspace = true
tokio.default-features = false

toml.workspace = true

tracing.workspace = true

reqwest.workspace = true
reqwest.default-features = false
reqwest.features = ["rustls-tls-webpki-roots", "json"]

rustls.version = "0.23"
rustls.default-features = false
rustls.features = ["std", "ring"]

serde_json.workspace = true
serde_json.default-features = false
serde_json.features = ["std"]

drmem-api = { path = "../../drmem-api", version = "0.8" }
